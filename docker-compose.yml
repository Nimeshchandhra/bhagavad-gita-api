version: "3.9"

services:
  db:
    image: postgres:13
    container_name: gita-db
    restart: always
    environment:
      POSTGRES_USER: gita
      POSTGRES_PASSWORD: gita
      POSTGRES_DB: gita
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: gita-api
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: gita
      POSTGRES_PASSWORD: gita
      POSTGRES_DB: gita
      DB_HOST: db
      DB_PORT: 5432
      TESTER_API_KEY: dummy
    command: >
      sh -c "
      python bhagavad_gita_api/seed.py &&
      uvicorn bhagavad_gita_api.main:app --host 0.0.0.0 --port 8000
      "

volumes:
  postgres_data: